name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle: dmg
            artifact: macOS-universal
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        id: version
        shell: bash
        run: node scripts/check-release-version.mjs
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - run: npm ci
      - name: Test frontend and command models
        run: npm test
      - name: Test native backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installer
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect installer
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          PLATFORM: ${{ matrix.artifact }}
        run: |
          mkdir -p release-assets
          if [ "$PLATFORM" = macOS-universal ]; then
            files=("$BUNDLE_DIR"/*.dmg)
            destination="release-assets/FFmpeg-Workbench_${APP_VERSION}_macOS-universal.dmg"
          else
            files=("$BUNDLE_DIR"/*.exe)
            destination="release-assets/FFmpeg-Workbench_${APP_VERSION}_Windows-x64-setup.exe"
          fi
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"
          cp "${files[0]}" "$destination"
      - name: Verify macOS disk image, architectures and signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-installer.sh release-assets/*.dmg '${{ steps.version.outputs.version }}'
      - name: Verify Windows installation, startup and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -InstallerPath (Get-ChildItem release-assets/*.exe).FullName
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish both installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and create checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cd release-assets
          test -s "FFmpeg-Workbench_${version}_macOS-universal.dmg"
          test -s "FFmpeg-Workbench_${version}_Windows-x64-setup.exe"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish preview release after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "FFmpeg Workbench ${RELEASE_TAG} Preview" --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
