[package]
name = "ffmpeg-workbench"
version = "0.1.0"
description = "A local FFmpeg desktop workbench"
authors = ["FFmpeg Workbench contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ffmpeg_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "net", "fs"] }
tempfile = "3"
getrandom = "0.4"
http-range = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
